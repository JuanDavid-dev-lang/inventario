name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  php:
    name: Backend PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      # Catches syntax errors across the API. There is no local PHP in the
      # development environment used for this repo, so this is the check.
      - name: Lint every PHP file
        run: find backend docker tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate composer manifest
        run: composer validate --no-check-lock --working-dir backend

      # A guard against reintroducing the auth holes that were removed:
      # a hard-coded JWT secret, demo credentials, and a plain-text password
      # comparison. Cheaper than a test and it fails loudly in review.
      - name: Refuse known auth regressions
        run: |
          ! grep -rn "tu_secret_key" backend/
          ! grep -rn "is_demo_admin_login" backend/
          ! grep -rn "hash_equals((string) \$user\['password'\]" backend/
          grep -q "require_auth()" backend/public/index.php

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx jest
      - run: npm run build

  python:
    name: Machine learning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyspark and a JVM are deliberately not installed: the Spark suites skip
      # themselves when it is absent, and pulling a 300 MB dependency into every
      # run to exercise four tests is not a trade worth making.
      - name: Install dependencies
        run: pip install pytest pytest-cov pytest-mock numpy pandas scikit-learn joblib requests

      - name: Run tests
        run: pytest tests/unit/python --no-cov -q
