steps:
  # Step 1: Build Backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario-api:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario-api:$SHORT_SHA'
      - '-f'
      - 'docker/Dockerfile.backend'
      - '.'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/inventario-api:$SHORT_SHA']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'inventario-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/inventario-api:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--timeout'
      - '300'
      - '--add-cloudsql-instances'
      - 'noble-return-447622-s1:southamerica-east1:inventario-db'
      - '--set-env-vars'
      - 'DB_USER=JuanDavid,DB_PASSWORD=Jotaro\,07\,2006,DB_NAME=inventario_db,INSTANCE_CONNECTION_NAME=noble-return-447622-s1:southamerica-east1:inventario-db'

images:
  - 'gcr.io/$PROJECT_ID/inventario-api:$SHORT_SHA'

timeout: 1800s

substitutions:
  _REGION: 'southamerica-east1'
