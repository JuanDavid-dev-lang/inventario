steps:
  # Build Backend (PHP)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario-backend:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario-backend:$SHORT_SHA'
      - '-f'
      - 'docker/Dockerfile.backend'
      - '.'

  # Build Frontend (React + Nginx)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario-frontend:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario-frontend:$SHORT_SHA'
      - '-f'
      - 'docker/Dockerfile.frontend'
      - '.'

  # Push Backend to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/inventario-backend:$SHORT_SHA'

  # Push Frontend to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/inventario-frontend:$SHORT_SHA'

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'deploy-backend'
    args:
      - 'run'
      - '--filename=.'
      - '--image=gcr.io/$PROJECT_ID/inventario-backend:$SHORT_SHA'
      - '--location=southamerica-east1'
      - '--output=/workspace/backend'

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'deploy-frontend'
    args:
      - 'run'
      - '--filename=.'
      - '--image=gcr.io/$PROJECT_ID/inventario-frontend:$SHORT_SHA'
      - '--location=southamerica-east1'
      - '--output=/workspace/frontend'

# Push images to Container Registry
images:
  - 'gcr.io/$PROJECT_ID/inventario-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/inventario-frontend:$SHORT_SHA'

# Build timeout
timeout: 3600s

# Substitutions for environment
substitutions:
  _REGION: 'southamerica-east1'
  _BACKEND_SERVICE: 'inventario-backend'
  _FRONTEND_SERVICE: 'inventario-frontend'
