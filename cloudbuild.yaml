steps:
  # Debug: Check what's actually in the build context
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args: ['version']
    
  # Use git to fetch backend files directly in the build step
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-f'
      - 'Dockerfile'
      - '--target'
      - 'production'
      - '.'
    waitFor: ['-']

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/inventario:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/cloud-run'
    args:
      - 'deploy'
      - 'inventario'
      - '--image=gcr.io/$PROJECT_ID/inventario:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'
      - '--memory=1Gi'
      - '--cpu=2'

images:
  - 'gcr.io/$PROJECT_ID/inventario:latest'
