options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
steps:
  # Build Backend
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario-backend'
      - '-f'
      - 'docker/Dockerfile.backend'
      - '--no-cache'
      - '.'
    dir: '.'
    waitFor: ['-']

  # Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario-frontend'
      - '-f'
      - 'docker/Dockerfile.frontend'
      - '--no-cache'
      - '.'
    dir: '.'
    waitFor: ['-']

  # Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/inventario-backend']

  # Push Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/inventario-frontend']

  # Deploy Backend to Cloud Run
  - name: 'gcr.io/cloud-builders/cloud-run'
    args:
      - 'deploy'
      - 'inventario-backend'
      - '--image=gcr.io/$PROJECT_ID/inventario-backend'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'

  # Deploy Frontend to Cloud Run
  - name: 'gcr.io/cloud-builders/cloud-run'
    args:
      - 'deploy'
      - 'inventario-frontend'
      - '--image=gcr.io/$PROJECT_ID/inventario-frontend'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'

images:
  - 'gcr.io/$PROJECT_ID/inventario-backend'
  - 'gcr.io/$PROJECT_ID/inventario-frontend'
