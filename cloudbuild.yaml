steps:
  # Build single container image with backend + frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/inventario:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/cloud-run'
    args:
      - 'deploy'
      - 'inventario'
      - '--image=gcr.io/$PROJECT_ID/inventario:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'
      - '--memory=1Gi'
      - '--cpu=2'

images:
  - 'gcr.io/$PROJECT_ID/inventario:latest'
