  </text>
  <text x="500" y="325" font-size="36" font-weight="bold" text-anchor="middle" fill="#3498db">
    4,368
  </text>
  <text x="500" y="350" font-size="11" text-anchor="middle" fill="#3498db">
    unidades
  </text>
  
  <!-- ESCENARIO 3: SLOW-MOVING -->
  <rect x="670" y="110" width="280" height="280" fill="white" stroke="#e74c3c" stroke-width="3" rx="10"/>
  
  <!-- Header -->
  <rect x="670" y="110" width="280" height="50" fill="#e74c3c" rx="10 10 0 0"/>
