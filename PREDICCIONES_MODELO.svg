  <!-- Subtitle -->
  <text x="500" y="65" font-size="12" text-anchor="middle" fill="#7f8c8d">
    3 Escenarios de Predicción | R² = 0.9988 (99.88% Precisión)
  </text>
  
  <!-- Dividing line -->
  <line x1="50" y1="80" x2="950" y2="80" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- ESCENARIO 1: BEST-SELLER -->
  <rect x="50" y="110" width="280" height="280" fill="white" stroke="#27ae60" stroke-width="3" rx="10"/>
  
  <!-- Header -->
  <rect x="50" y="110" width="280" height="50" fill="#27ae60" rx="10 10 0 0"/>
  <text x="190" y="145" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    🏆 BEST-SELLER
  </text>
  
  <!-- Características -->
  <text x="70" y="180" font-size="11" fill="#34495e" font-weight="bold">Características:</text>
