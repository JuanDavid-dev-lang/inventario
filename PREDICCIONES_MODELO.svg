  </text>
  
  <rect x="120" y="520" width="150" height="60" fill="white" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="195" y="540" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">
    Best-Seller vs Normal
  </text>
  <text x="195" y="565" font-size="18" font-weight="bold" text-anchor="middle" fill="#27ae60">
    225.86x
  </text>
  
  <rect x="290" y="520" width="150" height="60" fill="white" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="365" y="540" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">
    Normal vs Slow
  </text>
  <text x="365" y="565" font-size="18" font-weight="bold" text-anchor="middle" fill="#3498db">
    14.32x
  </text>
  
  <rect x="460" y="520" width="150" height="60" fill="white" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="535" y="540" font-size="11" font-weight="bold" text-anchor="middle" fill="#e74c3c">
    Best-Seller vs Slow
  </text>
  <text x="535" y="565" font-size="18" font-weight="bold" text-anchor="middle" fill="#e74c3c">
    3,233.38x
  </text>
  
  <!-- Tabla resumen -->
  <text x="70" y="615" font-size="12" font-weight="bold" fill="#2c3e50">
    📋 RESUMEN DE PREDICCIONES:
  </text>
  
  <!-- Tabla headers -->
  <line x1="120" y1="635" x2="850" y2="635" stroke="#34495e" stroke-width="2"/>
  <text x="130" y="655" font-size="11" font-weight="bold" fill="#34495e">Tipo de Producto</text>
  <text x="350" y="655" font-size="11" font-weight="bold" fill="#34495e">Predicción</text>
  <text x="550" y="655" font-size="11" font-weight="bold" fill="#34495e">% del Total</text>
  <text x="750" y="655" font-size="11" font-weight="bold" fill="#34495e">Estado</text>
  
  <!-- Tabla rows -->
  <line x1="120" y1="670" x2="850" y2="670" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="685" font-size="10" fill="#34495e">🏆 Best-Seller</text>
  <text x="350" y="685" font-size="10" fill="#27ae60" font-weight="bold">986,562 u</text>
  <text x="550" y="685" font-size="10" fill="#27ae60" font-weight="bold">99.15%</text>
  <text x="750" y="685" font-size="10" fill="#27ae60">✅ Crítico</text>
  
  <line x1="120" y1="700" x2="850" y2="700" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="715" font-size="10" fill="#34495e">📦 Normal</text>
  <text x="350" y="715" font-size="10" fill="#3498db" font-weight="bold">4,368 u</text>
  <text x="550" y="715" font-size="10" fill="#3498db" font-weight="bold">0.44%</text>
  <text x="750" y="715" font-size="10" fill="#3498db">✓ OK</text>
  
  <line x1="120" y1="730" x2="850" y2="730" stroke="#bdc3c7" stroke-width="1"/>
  <text x="130" y="745" font-size="10" fill="#34495e">🐢 Slow-Moving</text>
  <text x="350" y="745" font-size="10" fill="#e74c3c" font-weight="bold">305 u</text>
  <text x="550" y="745" font-size="10" fill="#e74c3c" font-weight="bold">0.03%</text>
  <text x="750" y="745" font-size="10" fill="#e74c3c">⚠️ Bajo</text>
</svg>