    • Venta promedio: 500,000 u/día
  </text>
  <text x="70" y="218" font-size="10" fill="#34495e">
    • Stock promedio: 200,000 u
  </text>
  <text x="70" y="236" font-size="10" fill="#34495e">
    • Transacciones: 3
  </text>
  
  <!-- Predicción -->
  <rect x="70" y="260" width="240" height="90" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="80" y="280" font-size="11" font-weight="bold" fill="#27ae60">
    PREDICCIÓN PARA PRÓXIMO PERÍODO:
  </text>
  <text x="190" y="325" font-size="36" font-weight="bold" text-anchor="middle" fill="#27ae60">
    986,562
  </text>
  <text x="190" y="350" font-size="11" text-anchor="middle" fill="#27ae60">
    unidades
  </text>
  
  <!-- ESCENARIO 2: NORMAL -->
  <rect x="360" y="110" width="280" height="280" fill="white" stroke="#3498db" stroke-width="3" rx="10"/>
  
  <!-- Header -->
  <rect x="360" y="110" width="280" height="50" fill="#3498db" rx="10 10 0 0"/>
  <text x="500" y="145" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    📦 NORMAL
  </text>
  
  <!-- Características -->
  <text x="380" y="180" font-size="11" fill="#34495e" font-weight="bold">Características:</text>
  <text x="380" y="200" font-size="10" fill="#34495e">
