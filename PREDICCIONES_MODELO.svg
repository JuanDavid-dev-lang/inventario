  <text x="70" y="450" font-size="16" font-weight="bold" fill="#2c3e50">
    📊 GRÁFICA COMPARATIVA
  </text>
  
  <!-- Escala de barras -->
  <!-- Eje X -->
  <line x1="100" y1="640" x2="900" y2="640" stroke="#34495e" stroke-width="2"/>
  
  <!-- Eje Y -->
  <line x1="100" y1="480" x2="100" y2="640" stroke="#34495e" stroke-width="2"/>
  
  <!-- Labels eje Y -->
  <text x="85" y="645" font-size="10" text-anchor="end" fill="#34495e">0</text>
  <text x="85" y="590" font-size="10" text-anchor="end" fill="#34495e">250K</text>
  <text x="85" y="535" font-size="10" text-anchor="end" fill="#34495e">500K</text>
  <text x="85" y="485" font-size="10" text-anchor="end" fill="#34495e">1M</text>
  
  <!-- Grid lines -->
  <line x1="100" y1="585" x2="900" y2="585" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="100" y1="530" x2="900" y2="530" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Barras (escaladas: 986,562 máximo) -->
  <!-- Best-Seller bar: 986562/1000000 * 150 = 148px -->
  <rect x="200" y="490" width="60" height="150" fill="#27ae60" rx="3"/>
  <text x="230" y="660" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">
    Best-Seller
  </text>
  <text x="230" y="470" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">
    986K
  </text>
  
  <!-- Normal bar: 4368/1000000 * 150 = 0.7px (muy pequeño) -->
  <rect x="420" y="635" width="60" height="5" fill="#3498db" rx="2"/>
  <text x="450" y="660" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">
    Normal
  </text>
  <text x="450" y="627" font-size="11" font-weight="bold" text-anchor="middle" fill="#3498db">
    4.3K
  </text>
  
  <!-- Slow-moving bar: 305/1000000 * 150 = 0.05px (invisible) -->
  <rect x="640" y="638" width="60" height="2" fill="#e74c3c" rx="1"/>
  <text x="670" y="660" font-size="11" font-weight="bold" text-anchor="middle" fill="#e74c3c">
    Slow-Moving
  </text>
  <text x="670" y="632" font-size="11" font-weight="bold" text-anchor="middle" fill="#e74c3c">
    305
  </text>
  
  <!-- Comparativa de ratios -->
  <text x="70" y="505" font-size="12" font-weight="bold" fill="#2c3e50">
