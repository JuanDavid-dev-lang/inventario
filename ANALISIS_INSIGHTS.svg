<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="500" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    📊 ANÁLISIS DE DATOS GENERADOS - INSIGHTS DEL MODELO
  </text>
  
  <!-- Dividing line -->
  <line x1="50" y1="60" x2="950" y2="60" stroke="#bdc3c7" stroke-width="2"/>
  
  <!-- Section 1: TOP 10 BEST SELLERS -->
  <rect x="50" y="90" width="430" height="320" fill="white" stroke="#3498db" stroke-width="2" rx="10"/>
  
  <text x="70" y="120" font-size="14" font-weight="bold" fill="#3498db">
    🏆 TOP 10 BEST SELLERS
  </text>
  
  <line x1="70" y1="130" x2="470" y2="130" stroke="#3498db" stroke-width="1"/>
  
  <!-- Top sellers list with bars -->
  <text x="70" y="160" font-size="11" fill="#34495e">Producto 3312: 2,000,073 unidades</text>
  <rect x="260" y="150" width="150" height="15" fill="#3498db" rx="3"/>
  
  <text x="70" y="190" font-size="11" fill="#34495e">Producto 3028: 1,050,198 unidades</text>
  <rect x="260" y="180" width="78" height="15" fill="#5dade2" rx="3"/>
  
  <text x="70" y="220" font-size="11" fill="#34495e">Producto 4545: 1,050,117 unidades</text>
  <rect x="260" y="210" width="78" height="15" fill="#5dade2" rx="3"/>
  
  <text x="70" y="250" font-size="11" fill="#34495e">Producto 4736: 1,010,126 unidades</text>
  <rect x="260" y="240" width="75" height="15" fill="#85c1e2" rx="3"/>
  
  <text x="70" y="280" font-size="11" fill="#34495e">Producto 2839: 1,009,999 unidades</text>
  <rect x="260" y="270" width="75" height="15" fill="#85c1e2" rx="3"/>
  
  <text x="70" y="310" font-size="11" fill="#34495e">Más productos con ventas altas...</text>
  
  <text x="70" y="345" font-size="10" fill="#7f8c8d" font-style="italic">
    5 productos generan >1M de unidades
  </text>
  
  <text x="70" y="380" font-size="10" fill="#7f8c8d" font-style="italic">
    Oportunidad: Optimizar stock para best-sellers
  </text>
  
  <!-- Section 2: PRODUCT VELOCITY -->
  <rect x="520" y="90" width="430" height="320" fill="white" stroke="#27ae60" stroke-width="2" rx="10"/>
  
  <text x="540" y="120" font-size="14" font-weight="bold" fill="#27ae60">
    🚀 VELOCIDAD DE PRODUCTOS
  </text>
  
  <line x1="540" y1="130" x2="940" y2="130" stroke="#27ae60" stroke-width="1"/>
  
  <!-- Velocity chart -->
  <text x="540" y="165" font-size="13" font-weight="bold" fill="#34495e">Fast-Moving (>10 movimientos):</text>
  <rect x="540" y="175" width="120" height="40" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="600" y="205" font-size="24" font-weight="bold" text-anchor="middle" fill="#27ae60">1</text>
  <text x="540" y="225" font-size="10" fill="#7f8c8d">Producto con alta rotación</text>
  
  <text x="720" y="165" font-size="13" font-weight="bold" fill="#34495e">Slow-Moving (≤5 movimientos):</text>
  <rect x="720" y="175" width="150" height="40" fill="#fadbd8" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="795" y="205" font-size="20" font-weight="bold" text-anchor="middle" fill="#e74c3c">2,388</text>
  <text x="720" y="225" font-size="10" fill="#7f8c8d">Productos con baja rotación</text>
  
  <!-- Pie chart for velocity -->
  <circle cx="670" cy="300" r="50" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <circle cx="670" cy="300" r="35" fill="none" stroke="#27ae60" stroke-width="25"
          stroke-dasharray="13.7 351.9" stroke-dashoffset="0"/>
  <circle cx="670" cy="300" r="35" fill="none" stroke="#e74c3c" stroke-width="25"
          stroke-dasharray="337.3 351.9" stroke-dashoffset="-13.7"/>
  
  <text x="650" y="290" font-size="11" font-weight="bold" fill="#27ae60">0.04%</text>
  <text x="680" y="350" font-size="11" font-weight="bold" fill="#e74c3c">99.96%</text>
  
  <text x="540" y="380" font-size="10" fill="#7f8c8d" font-style="italic">
    ⚠️ Mayoría de productos con movimiento bajo
  </text>
  
  <text x="540" y="400" font-size="10" fill="#7f8c8d" font-style="italic">
    Oportunidad: Promover stock lento, limpiar obsoletos
  </text>
  
  <!-- Section 3: STOCK HEALTH -->
  <rect x="50" y="430" width="430" height="280" fill="white" stroke="#f39c12" stroke-width="2" rx="10"/>
  
  <text x="70" y="460" font-size="14" font-weight="bold" fill="#f39c12">
    💊 SALUD DEL INVENTARIO
  </text>
  
  <line x1="70" y1="470" x2="470" y2="470" stroke="#f39c12" stroke-width="1"/>
  
  <!-- Health status indicators -->
  <rect x="70" y="495" width="300" height="50" fill="#ffe8cc" stroke="#f39c12" stroke-width="1" rx="5"/>
  <text x="85" y="515" font-size="12" font-weight="bold" fill="#d68910">⚠️ BAJO STOCK (&lt;10 unidades)</text>
  <text x="85" y="535" font-size="20" font-weight="bold" fill="#f39c12">26 productos</text>
  
  <rect x="70" y="560" width="300" height="50" fill="#ffcccc" stroke="#e74c3c" stroke-width="1" rx="5"/>
  <text x="85" y="580" font-size="12" font-weight="bold" fill="#c0392b">🔴 STOCK CRÍTICO (0 unidades)</text>
  <text x="85" y="600" font-size="20" font-weight="bold" fill="#e74c3c">242 productos</text>
  
  <text x="70" y="645" font-size="11" fill="#7f8c8d" font-weight="bold">
    Total afectados: 268 productos (9.8%)
  </text>
  
  <!-- Section 4: ANOMALIES DETECTED -->
  <rect x="520" y="430" width="430" height="280" fill="white" stroke="#c0392b" stroke-width="2" rx="10"/>
  
  <text x="540" y="460" font-size="14" font-weight="bold" fill="#c0392b">
    🚨 ANOMALÍAS DETECTADAS
  </text>
  
  <line x1="540" y1="470" x2="940" y2="470" stroke="#c0392b" stroke-width="1"/>
  
  <!-- Anomalies count -->
  <rect x="540" y="495" width="380" height="60" fill="#fadbd8" stroke="#c0392b" stroke-width="2" rx="5"/>
  <text x="560" y="520" font-size="12" fill="#34495e">Total de anomalías encontradas:</text>
  <text x="560" y="545" font-size="28" font-weight="bold" fill="#c0392b">37</text>
  
  <!-- Anomaly types -->
  <text x="540" y="590" font-size="11" fill="#34495e" font-weight="bold">Tipos:</text>
  
  <text x="560" y="610" font-size="10" fill="#34495e">
    • Cantidades negativas (-100, -50, -999)
  </text>
  
  <text x="560" y="628" font-size="10" fill="#34495e">
    • Cantidades excesivas (10000+)
  </text>
  
  <text x="560" y="646" font-size="10" fill="#34495e">
    • Inconsistencias de stock antes/después
  </text>
  
  <text x="560" y="664" font-size="10" fill="#7f8c8d" font-style="italic">
    ✓ Detectadas por análisis estadístico (>2σ)
  </text>
  
  <!-- Bottom stats bar -->
  <rect x="50" y="740" width="900" height="40" fill="#2c3e50" rx="10"/>
  
  <text x="70" y="765" font-size="12" font-weight="bold" fill="white">
    ✅ CONCLUSIÓN: Dataset balanceado con 10,022 registros | Modelo R² = 0.9988 (99.88% precisión) | Listo para predicción
  </text>
</svg>