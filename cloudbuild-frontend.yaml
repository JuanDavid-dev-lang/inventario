steps:
  # Step 1: Build Frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_URL=https://inventario-api-208277945925.southamerica-east1.run.app'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario-frontend:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/inventario-frontend:$SHORT_SHA'
      - '-f'
      - 'docker/Dockerfile.frontend'
      - '.'

  # Step 2: Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/inventario-frontend:$SHORT_SHA']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'inventario-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/inventario-frontend:$SHORT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'VITE_API_URL=https://inventario-api-208277945925.southamerica-east1.run.app'

images:
  - 'gcr.io/$PROJECT_ID/inventario-frontend:$SHORT_SHA'

timeout: 1800s

substitutions:
  _REGION: 'southamerica-east1'
